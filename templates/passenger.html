{% extends "layout.html" %}

{% block content %}

<h1>Passenger Dashboard</h1>

<p>Enter your trip information to get a fare prediction.</p>

<form action="/predict" method="POST">

    <label>Distance (km)</label>
    <input type="number" name="distance" step="0.1" required>

    <label>Duration (minutes)</label>
    <input type="number" name="duration" step="0.1" required>

    <label>Traffic Level</label>
    <select name="traffic" required>
        <option value="1">Low</option>
        <option value="2">Medium</option>
        <option value="3">High</option>
    </select>

    <label>Hour</label>
    <input type="number" name="hour" min="0" max="23" required>

    <label>Passenger Count</label>
    <input type="number" name="passengers" min="1" required>

    <button type="submit">Predict Fare</button>

</form>

{% endblock %}
