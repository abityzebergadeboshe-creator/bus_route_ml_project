{% extends "layout.html" %}

{% block title %}Driver Verification - GuzoAI{% endblock %}

{% block content %}

<section class="form-section">

    <h1>Driver Verification</h1>

    <p>
        Register as a GuzoAI driver by entering your information below.
    </p>

    <form action="{{ url_for('verify') }}" method="POST">

        <div class="form-group">
            <label for="driver_name">Driver Name</label>
            <input
                type="text"
                id="driver_name"
                name="driver_name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="form-group">
            <label for="driver_id">Driver ID</label>
            <input
                type="text"
                id="driver_id"
                name="driver_id"
                placeholder="Enter your driver ID"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle">Vehicle Number</label>
            <input
                type="text"
                id="vehicle"
                name="vehicle"
                placeholder="Enter your vehicle number"
                required
            >
        </div>

        <button type="submit" class="btn">
            Submit Verification
        </button>

    </form>

</section>

{% endblock %}
